name: Evals

on:
  push:
    paths-ignore: ['docs/**', '*.md']

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: fieldops
          POSTGRES_PASSWORD: fieldops
          POSTGRES_DB: fieldops_eval
        options: >-
          --health-cmd "pg_isready -U fieldops" --health-interval 5s --health-retries 20
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://fieldops:fieldops@127.0.0.1:5432/fieldops_eval
      DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
      JUDGE_MODEL_ID: ${{ secrets.JUDGE_MODEL_ID }}
      GENERATION_MODEL_ID: deepseek-ai/DeepSeek-V4-Flash
      EMBEDDING_BASE_URL: https://api.deepinfra.com/v1/openai/embeddings
      EMBEDDING_MODEL_ID: Qwen/Qwen3-Embedding-4B
      EMBEDDING_DIMENSIONS: "1536"
      EVAL_CONCURRENCY: "1"
      EVAL_CASE_LIMIT: "2"
      SKIP_DRIFT_VALIDATION: "1"
    steps:
      # runner.temp is only available in step env, not job env.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run migrate
      - run: npm test
      - run: npm run seed:corpus
        env:
          OBJECT_STORE_DIR: ${{ runner.temp }}/objects
      - run: npm run eval
        env:
          OBJECT_STORE_DIR: ${{ runner.temp }}/objects
      - run: npm run eval:gate
      - run: npm run badge
        if: always()
        env:
          OBJECT_STORE_DIR: ${{ runner.temp }}/objects
